name: Build Windows Release

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Package Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtquick3d qtquickeffectmaker qtquicktimeline qtshadertools'
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          $qtRoot = $env:QT_ROOT_DIR.Replace('\', '/')
          Write-Host "Configuring CMake with Qt root: $qtRoot"
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -DBUILD_TESTING=OFF `
            -DENABLE_WINDEPLOYQT=OFF

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy Windows Package
        shell: pwsh
        run: |
          $qtRoot = $env:QT_ROOT_DIR.Replace('\', '/')
          # 1. 安装主程序至 install/CarrierVision_windows_* 目录
          cmake --install build

          # 定位安装目录
          $pkgDir = Get-ChildItem -Path "install" -Directory -Filter "CarrierVision_windows_*" | Select-Object -First 1
          if (-not $pkgDir) {
            throw "Install directory install/CarrierVision_windows_* not found"
          }
          $pkgPath = $pkgDir.FullName
          $pkgName = $pkgDir.Name
          Write-Host "Deploying to package directory: $pkgPath ($pkgName)"

          # 2. 执行 Windows 规范化部署与依赖归拢 (lib/, plugins/, qml/, qt.conf, CarrierVision.bat)
          python scripts/deploy_windows.py --install-dir "$pkgPath" --qt-dir "$qtRoot" --source-dir .

          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_NAME=$pkgName"
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_PATH=$pkgPath"

      - name: Compress to ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PACKAGE_PATH\*" -DestinationPath "$env:PACKAGE_NAME.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip
          retention-days: 14
