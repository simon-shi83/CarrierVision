name: Build Windows Release

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Package Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtquick3d qtquickeffectmaker qtquicktimeline qtshadertools'
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          $qtRoot = $env:QT_ROOT_DIR.Replace('\', '/')
          Write-Host "Configuring CMake with Qt root: $qtRoot"
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -DBUILD_TESTING=ON `
            -DENABLE_WINDEPLOYQT=OFF

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build build --config Release -j8

      - name: Run Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --build-config Release --output-on-failure
          $cvTestExitCode = $LASTEXITCODE
          if ($cvTestExitCode -ne 0) {
            if (Test-Path build/WheelSelectionTests.txt) {
              Get-Content build/WheelSelectionTests.txt
            }
            exit $cvTestExitCode
          }

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-logs
          path: |
            build/Testing/Temporary/LastTest.log
            build/WheelSelectionTests.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy Windows Package
        shell: pwsh
        run: |
          $qtRoot = $env:QT_ROOT_DIR.Replace('\', '/')
          $workspace = $PWD.Path.Replace('\', '/')
          $commitCount = (git rev-list --count HEAD).Trim()
          $shortHash = (git rev-parse --short=7 HEAD).Trim()
          $pkgName = "CarrierVision_windows_5.0.0.$commitCount.$shortHash"
          $pkgPath = "$workspace/install/$pkgName"
          Write-Host "Deploying to package directory: $pkgPath ($pkgName)"

          # 1. 显式指定安装前缀，确保准确安装至指定目录
          cmake --install build --prefix "$pkgPath"

          # 2. 执行 Windows 规范化部署与依赖归拢 (lib/, plugins/, qml/, qt.conf, CarrierVision.bat)
          cmake "-DCV_INSTALL_DIR=$pkgPath" "-DCV_QT_DIR=$qtRoot" "-DCV_SOURCE_DIR=$workspace" -P "$workspace/cmake/DeployWindows.cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Package contents:"
          Get-ChildItem -Path "$pkgPath"

          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_NAME=$pkgName"
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_PATH=$pkgPath"

      - name: Compress to ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PACKAGE_PATH\*" -DestinationPath "$env:PACKAGE_NAME.zip" -Force

      # 增量包：只含程序本体与启动脚本，不含 Qt 运行库（lib/、plugins/、qml/）和 assets/。
      # 现场已装过同一 Qt 版本的完整包时，解压覆盖即可升级；Qt 版本、字体或模型变化时用完整包
      - name: Build Update Package
        shell: pwsh
        run: |
          $updateName = "$env:PACKAGE_NAME" + "_update"
          $updatePath = Join-Path $PWD "install/$updateName"
          New-Item -ItemType Directory -Force -Path $updatePath | Out-Null
          $files = @("CarrierVision.exe", "CarrierVision.bat", "CarrierVision_watchdog.bat",
                     "register_env.bat", "unregister_env.bat", "README.txt", "CarrierVision.svg")
          foreach ($f in $files) {
            $src = Join-Path $env:PACKAGE_PATH $f
            if (Test-Path $src) { Copy-Item $src $updatePath }
          }
          if (-not (Test-Path (Join-Path $updatePath "CarrierVision.exe"))) { throw "增量包缺少 CarrierVision.exe" }
          Write-Host "Update package contents:"
          Get-ChildItem -Path $updatePath
          Compress-Archive -Path "$updatePath\*" -DestinationPath "$updateName.zip" -Force
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_NAME=$updateName"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip
          retention-days: 14

      - name: Upload Update Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPDATE_NAME }}
          path: ${{ env.UPDATE_NAME }}.zip
          retention-days: 14
